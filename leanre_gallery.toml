# Unified multi-project gallery configuration for `python3 -m leanre publish`.
#
# All paths are resolved relative to this file. Any project whose local source
# tree is not cloned on disk is skipped gracefully with a diagnostic message.
#
# Core vs. Notes separation:
#   - Tool-generated artifacts (manifests, circuits, module matrices, 2D maps,
#     search shards, and `data/corpus_comparison.json`) are always produced
#     deterministically by `leanre`.
#   - Separately authored review prose (`notes/<slug>/` or `extra_dossiers`) is
#     strictly optional and recorded in `manifest.provenance.notes_layer`.

schema_version = 1

[[projects]]
slug = "riemann-hypothesis"
title = "Riemann Hypothesis (Alpöge–Claude)"
root = true
