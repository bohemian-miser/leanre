<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>leanre — Lean 4 Proof Explorer</title>
  <meta name="description" content="Zero-CDN lazy-fetched static Lean 4 proof architecture explorer: 3-level Proof Circuits, findings, dossiers, decompilation blueprints, FLIRT atlas, portability islands, and sharded search.">
  <link rel="stylesheet" href="./site.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar" role="banner">
      <div class="topbar-inner">
        <a class="brand" href="#overview" id="brandLink" aria-label="leanre home">
          <span class="brand-mark" aria-hidden="true">λ</span>
          <span class="brand-name">leanre<span class="brand-dot">.site</span></span>
          <span class="brand-repo" id="brandRepo"></span>
        </a>

        <nav class="main-nav" id="mainNav" aria-label="Primary navigation">
          <button type="button" class="nav-tab active" data-route="overview" id="tab-overview">Overview</button>
          <button type="button" class="nav-tab" data-route="circuit" id="tab-circuit">Circuits</button>
          <button type="button" class="nav-tab" data-route="findings" id="tab-findings">Findings</button>
          <button type="button" class="nav-tab" data-route="dossiers" id="tab-dossiers">Dossiers</button>
          <button type="button" class="nav-tab" data-route="blueprints" id="tab-blueprints">Blueprints</button>
          <button type="button" class="nav-tab" data-route="flirt" id="tab-flirt">FLIRT</button>
          <button type="button" class="nav-tab hidden" data-route="atlas" id="tab-atlas">Atlas</button>
          <button type="button" class="nav-tab" data-route="portability" id="tab-portability">Islands</button>
          <button type="button" class="nav-tab" data-route="benchmarks" id="tab-benchmarks">Bench</button>
          <button type="button" class="nav-tab" data-route="search" id="tab-search">Search</button>
        </nav>

        <div class="topbar-actions">
          <button type="button" class="search-trigger" id="quickSearchBtn" title="Global sharded search (press /)">
            <span class="st-ico" aria-hidden="true">⌕</span>
            <span class="st-lbl">Search</span>
            <kbd>/</kbd>
          </button>
          <span class="net-badge" id="netBadge" title="Cumulative lazy-fetched static shard payload">loaded: 0 KB · 0 shards</span>
          <button type="button" class="icon-btn" id="themeToggleBtn" title="Toggle dark / light theme" aria-label="Toggle dark or light theme">
            <span id="themeIcon">☀</span>
          </button>
          <a class="repo-link hidden" id="repoExtLink" target="_blank" rel="noopener noreferrer" title="View pinned repository snapshot">GitHub ↗</a>
        </div>
      </div>
    </header>

    <main id="appMain" class="app-main" role="main" aria-live="polite">
      <div class="loading-card">
        <div class="spinner" aria-hidden="true"></div>
        <div>Loading static site manifest…</div>
      </div>
    </main>

    <footer class="site-footer" role="contentinfo">
      <div class="footer-inner">
        <span id="footerMeta">leanre static explorer · zero-CDN · lazy-fetched shards</span>
        <span class="footer-right">
          <span>Layer 1 kernel verification ≠ Layer 4 mathematical peer review</span>
        </span>
      </div>
    </footer>
  </div>

  <div class="circuit-tip" id="circuitTip" role="tooltip"></div>
  <script src="./site.js" defer></script>
</body>
</html>
