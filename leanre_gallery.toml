benchmark = "outputs/xrepo_benchmark.json"
atlas_summary = "outputs/atlas_summary.json"
embedding_2d = "outputs/embedding_2d.json"
xrefs_dir = "outputs/xrefs"
config = "leanre.toml"
findings_dir = "findings"
analysis_dir = "analysis"
research_dir = "research"
notes_dir = "notes/riemann-hypothesis"
repo_url = "https://github.com/leanprover-community/riemann-hypothesis"
pinned_commit = "40e56bab026552e089d7afcfeff08d2defb9c005"
