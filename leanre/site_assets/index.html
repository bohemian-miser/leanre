<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>leanre</title>
  <meta name="description" content="A structural reading of Lean 4 formal proofs: dependency diagrams, findings, dossiers, blueprints and declaration search, each linked to the exact line of source.">
  <link rel="stylesheet" href="./site.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar" role="banner">
      <div class="topbar-inner">
        <button type="button" class="icon-btn rail-toggle" id="railToggleBtn" title="Show or hide the outline" aria-label="Show or hide the outline" aria-controls="outlineRail" aria-expanded="true">☰</button>
        <div class="brand-wrap">
          <a class="brand" href="#overview" id="brandLink" aria-label="leanre home">
            <span class="brand-name">leanre</span>
          </a>
          <span class="brand-repo" id="brandRepo"></span>
          <div class="proj-switch hidden" id="projSwitch"></div>
        </div>

        <nav class="main-nav" id="mainNav" aria-label="Primary navigation">
          <button type="button" class="nav-tab" data-route="overview" id="tab-overview">Overview</button>
          <button type="button" class="nav-tab" data-route="circuit" id="tab-circuit">Diagrams</button>
          <button type="button" class="nav-tab" data-route="findings" id="tab-findings">Findings</button>
          <button type="button" class="nav-tab" data-route="dossiers" id="tab-dossiers">Dossiers</button>
          <button type="button" class="nav-tab" data-route="blueprints" id="tab-blueprints">Blueprints</button>
          <button type="button" class="nav-tab" data-route="flirt" id="tab-flirt">Clusters</button>
          <button type="button" class="nav-tab hidden" data-route="atlas" id="tab-atlas">Edge Map</button>
          <button type="button" class="nav-tab" data-route="portability" id="tab-portability">Islands</button>
          <button type="button" class="nav-tab" data-route="benchmarks" id="tab-benchmarks">Benchmarks</button>
          <button type="button" class="nav-tab hidden" data-route="experiments" id="tab-experiments">Experiments</button>
        </nav>

        <div class="topbar-actions">
          <button type="button" class="search-trigger" id="quickSearchBtn" title="Search declarations (press /)" aria-label="Search declarations">
            <span class="st-lbl">Search</span>
            <kbd>/</kbd>
          </button>
          <button type="button" class="icon-btn" id="themeToggleBtn" title="Switch between dark and light" aria-label="Switch between dark and light theme">
            <span id="themeIcon">☀</span>
          </button>
          <a class="repo-link hidden" id="repoExtLink" target="_blank" rel="noopener noreferrer" title="Source at the pinned commit">Source ↗</a>
        </div>
      </div>
    </header>

    <div class="body-wrap" id="bodyWrap">
      <aside class="outline-rail" id="outlineRail" aria-label="Outline"></aside>
      <div class="content-col">
        <nav class="crumb-bar hidden" id="crumbBar" aria-label="Breadcrumb"></nav>
        <main id="appMain" class="app-main" role="main" aria-live="polite">
          <div class="loading-card">
            <div class="spinner" aria-hidden="true"></div>
            <div>Loading…</div>
          </div>
        </main>
      </div>
    </div>

    <footer class="site-footer" role="contentinfo">
      <div class="footer-inner" id="footerMeta">leanre · AGPL-3.0-or-later</div>
    </footer>
  </div>

  <div class="circuit-tip" id="circuitTip" role="tooltip"></div>
  <script src="./site.js" defer></script>
</body>
</html>
