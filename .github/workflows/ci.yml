name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run Python unittest suite
        run: python3 -m unittest discover -s leanre -v
      - name: Run compute_sweep parser selftest
        run: python3 leanre/compute_sweep.py --selftest
      - name: Run repository hygiene audit
        run: python3 verify/audit_tree.py

  rust:
    name: Rust kernel-rs tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: leanre/kernel-rs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: leanre/kernel-rs
      - name: Run cargo test
        run: cargo test
